# Same as vcu.cfg but connects to the running core without holding NRST.
# Used by backup-vcu: with connect_assert_srst, OpenOCD leaves NRST asserted
# after init until a reset command, so a plain "halt; dump_image" reads the
# chip while it's in reset (that's why live register reads came back 0 on the
# Nucleo). Here "halt" stops the core where it is and the flash reads are real.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
reset_config srst_only srst_nogate connect_deassert_srst

source [find target/stm32f4x.cfg]
